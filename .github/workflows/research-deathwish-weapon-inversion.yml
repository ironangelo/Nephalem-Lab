name: Deathwish two-roll weapon seed inversion regression
on:
  push:
    branches: [research/deathwish-kadala-drop]
  workflow_dispatch:
jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/deathwish-weapon-inversion.mjs
