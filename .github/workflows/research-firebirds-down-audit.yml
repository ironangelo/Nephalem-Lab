name: Audit Firebird's Down observed drop for normal seed inversion
on:
  push:
    branches: [research/firebirds-down-drop-seed-2026-11-16]
    paths:
      - '.github/workflows/research-firebirds-down-audit.yml'
      - 'research/firebirds-down-audit.mjs'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Firebird pants model
        run: node research/firebirds-down-audit.mjs
