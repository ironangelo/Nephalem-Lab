name: V05 four more genuine browser seed recoveries
on:
  push:
    branches: [feature/web-lab-v05-e2e]
    paths: ['.github/workflows/v05-four-recoveries.yml','research/v05-browser-four-recoveries.mjs','src/v05-lab.js']
  workflow_dispatch:
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        fixture: [squirt, deathwish, breast, zodiac]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: npm run build:wasm
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/v05-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/lab-v05.html -o /dev/null
      - name: Enter actual drop and one or two actual Reforges
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: node research/v05-browser-four-recoveries.mjs
