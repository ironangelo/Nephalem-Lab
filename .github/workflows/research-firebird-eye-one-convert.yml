name: Synthetic one Convert result can recover a Kadala source seed
on:
  push:
    branches: [research/firebird-eye-kadala]
  workflow_dispatch:
jobs:
  invert-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:wasm
      - run: node research/firebird-eye-single-convert-recovery.mjs
