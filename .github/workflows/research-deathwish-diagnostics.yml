name: Deathwish S-vs-R one-operation identifiability
on:
  push:
    branches: [research/deathwish-kadala-drop]
  workflow_dispatch:
jobs:
  one-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/deathwish-diagnostic-comparison.mjs
