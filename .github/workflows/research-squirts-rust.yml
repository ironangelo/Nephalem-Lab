name: Verify real Squirt Reforge and natural Primal routes in Rust
on:
  push:
    branches: [research/squirts-two-drops-seed]
    paths:
      - '.github/workflows/research-squirts-rust.yml'
      - 'research/squirts-rust-verify.rs'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Clone fixed upstream D3Recipes
        run: |
          git clone --depth 1 https://github.com/FNGarvin/d3recipes.git reference
          cd reference
          git fetch --depth 1 origin 49fe28467db9ebbd096694d1408528b2c9ce5ea3
          git checkout 49fe28467db9ebbd096694d1408528b2c9ce5ea3
      - name: Replay real source and candidate 10 and 12 step routes
        run: |
          cp research/squirts-rust-verify.rs reference/core/examples/squirts_ref.rs
          cd reference/core
          cargo run --release --example squirts_ref
