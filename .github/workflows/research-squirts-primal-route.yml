name: Search natural Primal Squirt from real recovered seed
on:
  push:
    branches: [research/squirts-two-drops-seed]
    paths:
      - '.github/workflows/research-squirts-primal-route.yml'
      - 'research/squirts-natural-primal-search.mjs'
  workflow_dispatch:
jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        mode: [fewest-steps, balanced, souls-first]
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search from one uniquely recovered real Squirt Reforge
        env:
          START_SEED: '800657787'
          MODE: ${{ matrix.mode }}
          MAX_NODES: '1200000'
          MAX_STEPS: '28'
        run: node --max-old-space-size=5000 research/squirts-natural-primal-search.mjs
