name: Firebird 456 to 443 independent reforge test
on:
  push:
    branches: [research/firebird-456-to-443]
  workflow_dispatch:
jobs:
  test-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:wasm
      - run: node research/firebird-456-to-443.mjs
