name: V05 build browser WASM inverse solver
on:
  push:
    branches: [feature/web-lab-v05-e2e]
    paths: ['.github/workflows/v05-wasm.yml', 'solver/scan.c']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build WASM with parent scanner
        run: |
          clang --target=wasm32 -O3 -nostdlib -fno-builtin -Wl,--no-entry -Wl,--export-memory -Wl,--initial-memory=2097152 -o solver/scan.wasm solver/scan.c
          ls -l solver/scan.wasm
      - name: Commit branch-only browser binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/scan.wasm
          if ! git diff --cached --quiet; then
            git commit -m "Build v0.5 bidirectional recovery wasm"
            git push
          fi
