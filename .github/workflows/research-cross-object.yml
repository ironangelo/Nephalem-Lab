name: Cross-object MWC verification
on:
  push:
    branches: [research/drop-seed-formula]
  workflow_dispatch:
jobs:
  cross-object:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/cross-object-mwc.mjs
