name: Primal natural Firebird Down alternatives for all recovered drop seeds
on:
  push:
    branches: [research/firebirds-down-drop-seed-2026-11-16]
    paths:
      - '.github/workflows/research-firebirds-down-routes.yml'
      - 'research/firebirds-down-31-candidate-route-search.mjs'
  workflow_dispatch:
jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evaluate possible Primal pants routes from inferred original drop and first S
        env:
          SHARDS: '8'
          SHARD: ${{ matrix.shard }}
          MODE: 'balanced'
          MAX_NODES: '30000'
          MAX_STEPS: '21'
        run: node --max-old-space-size=4800 research/firebirds-down-31-candidate-route-search.mjs
