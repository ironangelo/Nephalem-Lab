name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'assets/**'
      - 'config/**'
      - 'solver/**'
      - 'package.json'
      - 'tests/**'
      - 'universal.html'
      - 'index.html'
      - 'style.css'
      - 'manifest.webmanifest'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Always bundle the current native seed solver, not the committed fallback binary.
      - run: npm run build:wasm
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub hosted Ubuntu runners already provide Android command-line tools.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Nephalem-Lab-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nephalem-Lab-Android-debug-APK
          path: Nephalem-Lab-debug.apk
          retention-days: 30
