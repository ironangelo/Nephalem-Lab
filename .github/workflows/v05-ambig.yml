name: Inspect ambiguous Zodiac affix attributes
on:
  push:
    branches: [feature/web-lab-v05-e2e]
    paths: ['.github/workflows/v05-ambig.yml','research/v05-ambiguous-affix-audit.mjs']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node research/v05-ambiguous-affix-audit.mjs
