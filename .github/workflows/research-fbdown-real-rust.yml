name: Independent Rust confirmation of real Firebird pants Reforge
on:
  push:
    branches: [research/firebirds-down-real-reforge-2026-11-16]
    paths:
      - '.github/workflows/research-fbdown-real-rust.yml'
      - 'research/firebirds-down-real-reforge-verify.rs'
  workflow_dispatch:
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clone exact D3Recipes revision
        run: |
          git clone --depth 1 https://github.com/FNGarvin/d3recipes.git reference
          cd reference
          git fetch --depth 1 origin 49fe28467db9ebbd096694d1408528b2c9ce5ea3
          git checkout 49fe28467db9ebbd096694d1408528b2c9ce5ea3
      - name: Reproduce screenshot-affixes from real Reforge in original Rust
        run: |
          cp research/firebirds-down-real-reforge-verify.rs reference/core/examples/fbdown_reals.rs
          cd reference/core
          cargo run --release --example fbdown_reals
