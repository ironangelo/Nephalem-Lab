name: Independent Rust verify natural Primal Pinions recipe
on:
  push:
    branches: [research/firebird-pinions-real-drop-reforge-2026-11-19]
    paths:
      - '.github/workflows/research-pinions-rust.yml'
      - 'research/pinions-primal-rust-validation.rs'
  workflow_dispatch:
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact original D3Recipes reference
        run: |
          git clone --depth 1 https://github.com/FNGarvin/d3recipes.git reference
          cd reference
          git fetch --depth 1 origin 49fe28467db9ebbd096694d1408528b2c9ce5ea3
          git checkout 49fe28467db9ebbd096694d1408528b2c9ce5ea3
      - name: Cross-verify exact real R and every C/R step in pinned original Rust
        run: |
          cp research/pinions-primal-rust-validation.rs reference/core/examples/real_pinions_primal.rs
          cd reference/core
          cargo run --release --example real_pinions_primal
