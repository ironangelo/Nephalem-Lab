name: V05 browser Firebird Eye Kadala Convert to Primal
on:
  push:
    branches: [feature/web-lab-v05-e2e]
    paths: ['.github/workflows/v05-eye-convert-browser.yml','research/v05-browser-eye-kadala-convert.mjs']
  workflow_dispatch:
jobs:
  eye:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: npm run build:wasm
      - run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/v05-eye-http.log 2>&1 &
          sleep 2
      - run: node research/v05-browser-eye-kadala-convert.mjs
